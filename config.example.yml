model_params:
  in_channels: 3
  image_size: 128
  num_embeddings: 512      # Size of codebook (number of discrete codes)
  embedding_dim: 64        # Dimension of each code vector
  commitment_cost: 0.25    # Weight for commitment loss
  
data_params:
  data_path: "Data/"
  train_batch_size: 64
  val_batch_size:  64
  split_ratio: 1
  num_workers: 8
  pin_memory: True

exp_params:
  max_epochs: 100
  LR: 0.001
  weight_decay: 0.000001
  scheduler_gamma: 0.5
  kld_weight: 0.01
  step_size: 20
  device_type: "cuda"

shamir:
  num_shares: 5
  threshold: 3

logging_params:
  base_dir: "logs/"
  graph_subdir: "graphs"
  recon_subdir: "reconstructions"
  share_subdir: "shares"
