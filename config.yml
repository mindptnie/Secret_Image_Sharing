model_params:
  in_channels: 3
  latent_dim: 1024
  image_size: 128
  manual_seed: 67

data_params:
  data_path: "Data/"
  train_batch_size: 64
  val_batch_size:  64
  num_workers: 8
  pin_memory: True

exp_params:
  LR: 0.001
  weight_decay: 0.000001
  scheduler_gamma: 0.5
  kld_weight: 0.0005

shamir:
  num_shares: 5
  threshold: 3

trainer_params:
  accelerator: "cuda"
  max_epochs: 10

logging_params:
  save_dir: "logs/"
